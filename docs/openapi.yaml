openapi: 3.0.3
info:
  title: Eventia API (versión corregida)
  version: 2.1.0
  description: |
    Documentación de los endpoints corregidos tras la auditoría de seguridad (Actividad 23) y del
    mecanismo de autenticación y control de acceso (Actividad 24).
    Los permisos y validaciones coinciden con el rediseño de la Fase 2 y con la implementación en `src/`.
servers:
  - url: http://localhost:3000/api

tags:
  - name: Autenticación
  - name: Usuarios
  - name: Eventos
  - name: Inscripciones

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token obtenido en POST /auth/login. Expira a los 15 minutos y se revoca con POST /auth/logout.
        Los 401 incluyen `codigo` (token_ausente, token_invalido, token_expirado, token_revocado) y el header WWW-Authenticate.

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, example: Datos inválidos }
        codigo:
          type: string
          enum: [token_ausente, token_invalido, token_expirado, token_revocado, evento_cerrado]
        detalles:
          type: array
          items:
            type: object
            properties:
              campo: { type: string, example: cupo }
              mensaje: { type: string, example: Too small: expected number to be >0 }

    RegistroUsuario:
      type: object
      additionalProperties: false
      required: [nombre, correo, password]
      properties:
        nombre: { type: string, minLength: 2, maxLength: 80, example: Ana }
        correo: { type: string, format: email, maxLength: 120, example: ana@email.com }
        password: { type: string, format: password, minLength: 8, maxLength: 72, example: ClaveSegura1 }
        telefono: { type: string, pattern: '^[0-9]{8}$', example: '55555555' }

    UsuarioPublico:
      type: object
      description: Única representación de usuario que se devuelve (nunca passwordHash ni teléfono).
      properties:
        id: { type: integer, example: 35 }
        nombre: { type: string, example: Carlos }
        correo: { type: string, format: email, example: carlos@email.com }

    Login:
      type: object
      additionalProperties: false
      required: [correo, password]
      properties:
        correo: { type: string, format: email, example: carlos@eventia.test }
        password: { type: string, format: password, example: Eventia2026! }

    LoginRespuesta:
      type: object
      properties:
        token: { type: string, example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... }
        tipo: { type: string, example: Bearer }
        expiraEn: { type: string, format: date-time }
        usuario: { $ref: '#/components/schemas/UsuarioConRol' }

    UsuarioConRol:
      allOf:
        - $ref: '#/components/schemas/UsuarioPublico'
        - type: object
          properties:
            rol: { type: string, enum: [usuario, organizador, administrador] }

    EventoEntrada:
      type: object
      additionalProperties: false
      required: [titulo, fecha, cupo, precio]
      properties:
        titulo: { type: string, minLength: 3, maxLength: 120, example: Concierto universitario }
        descripcion: { type: string, maxLength: 1000 }
        fecha: { type: string, format: date-time, description: Debe ser una fecha futura, example: '2026-12-05T19:00:00Z' }
        cupo: { type: integer, minimum: 1, maximum: 10000, example: 150 }
        precio: { type: number, minimum: 0, maximum: 100000, example: 75 }

    EventoModificacion:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Mismos campos que EventoEntrada, todos opcionales (al menos uno).
      properties:
        titulo: { type: string, minLength: 3, maxLength: 120 }
        descripcion: { type: string, maxLength: 1000 }
        fecha: { type: string, format: date-time }
        cupo: { type: integer, minimum: 1, maximum: 10000, description: No puede ser menor que los lugares ya inscritos }
        precio: { type: number, minimum: 0, maximum: 100000 }

    Evento:
      type: object
      properties:
        id: { type: integer, example: 25 }
        titulo: { type: string, example: Concierto universitario }
        descripcion: { type: string, nullable: true }
        fecha: { type: string, format: date-time }
        cupo: { type: integer, example: 150 }
        disponibles: { type: integer, example: 148 }
        precio: { type: number, example: 75 }
        organizadorId: { type: integer, example: 2, description: Se toma del token, nunca del cuerpo }
        estado: { type: string, enum: [abierto, cerrado], description: Un evento cerrado no admite cambios ni inscripciones }

    InscripcionEntrada:
      type: object
      additionalProperties: false
      required: [cantidad]
      properties:
        cantidad: { type: integer, minimum: 1, maximum: 4, example: 2 }

    Inscripcion:
      type: object
      properties:
        id: { type: integer, example: 125 }
        eventoId: { type: integer, example: 20 }
        cantidad: { type: integer, example: 2 }
        creadaEn: { type: string, example: '2026-10-19 15:30:00' }

  responses:
    BadRequest:
      description: Datos inválidos o propiedades no permitidas.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Token ausente, inválido, expirado o revocado.
      headers:
        WWW-Authenticate: { schema: { type: string, example: 'Bearer realm="eventia", error="invalid_token"' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: La sesión ha expirado. Inicie sesión nuevamente, codigo: token_expirado }
    Forbidden:
      description: El usuario no tiene el rol o no es dueño del recurso.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Recurso inexistente (o sin acceso, para no revelar su existencia).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Conflicto con el estado actual del recurso.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  parameters:
    EventoId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }

paths:
  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión (API 7)
      description: |
        Devuelve un JWT. El mensaje de error es idéntico si el correo no existe o si la contraseña es incorrecta.
        Máximo 5 intentos fallidos por IP + correo cada 15 minutos.
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Login' } } }
      responses:
        '200':
          description: Autenticación correcta.
          content: { application/json: { schema: { $ref: '#/components/schemas/LoginRespuesta' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Credenciales inválidas (mismo mensaje para correo o contraseña).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Credenciales inválidas }
        '429':
          description: Demasiados intentos fallidos.
          headers:
            RateLimit: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /auth/me:
    get:
      tags: [Autenticación]
      summary: Usuario autenticado (ruta protegida)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Usuario dueño del token.
          content: { application/json: { schema: { $ref: '#/components/schemas/UsuarioConRol' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Autenticación]
      summary: Cerrar sesión
      description: Revoca el token actual (por su jti) hasta su expiración.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Sesión cerrada. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout-todas:
    post:
      tags: [Autenticación]
      summary: Cerrar todas las sesiones del usuario
      description: Incrementa token_version; todos los tokens emitidos antes dejan de ser válidos.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Sesiones cerradas. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /usuarios:
    post:
      tags: [Usuarios]
      summary: Registrar usuario (API 2)
      description: Registro público. El rol se asigna en el servidor y siempre es "usuario"; enviar `rol` produce 400.
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegistroUsuario' } } }
      responses:
        '201':
          description: Usuario creado.
          content: { application/json: { schema: { $ref: '#/components/schemas/UsuarioPublico' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /usuarios/{id}:
    get:
      tags: [Usuarios]
      summary: Consultar usuario (API 6)
      description: Solo el propio usuario o un administrador. Devuelve únicamente id, nombre y correo (el administrador recibe además el rol).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Datos públicos del usuario.
          content: { application/json: { schema: { $ref: '#/components/schemas/UsuarioPublico' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /usuarios/{id}/inscripciones:
    get:
      tags: [Inscripciones]
      summary: Inscripciones de un usuario (Control 2)
      description: Solo el propio usuario o un administrador.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Inscripciones del usuario.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Inscripcion' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /eventos/mios:
    get:
      tags: [Eventos]
      summary: Eventos del organizador autenticado
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Solo los eventos cuyo organizador es el usuario del token.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Evento' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /eventos/{id}/cerrar:
    post:
      tags: [Eventos]
      summary: Cerrar un evento propio
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/EventoId' }]
      responses:
        '200':
          description: Evento cerrado.
          content: { application/json: { schema: { $ref: '#/components/schemas/Evento' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /eventos:
    get:
      tags: [Eventos]
      summary: Listar eventos públicos
      security: []
      responses:
        '200':
          description: Lista de eventos.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Evento' } }
    post:
      tags: [Eventos]
      summary: Crear evento (API 3)
      description: Solo organizador o administrador. El organizador del evento es el usuario autenticado.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EventoEntrada' } } }
      responses:
        '201':
          description: Evento creado.
          content: { application/json: { schema: { $ref: '#/components/schemas/Evento' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /eventos/{id}:
    put:
      tags: [Eventos]
      summary: Modificar evento propio (API 4)
      description: Rol organizador y además dueño del evento (o administrador). El evento debe estar abierto (409 si está cerrado).
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/EventoId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EventoModificacion' } } }
      responses:
        '200':
          description: Evento actualizado.
          content: { application/json: { schema: { $ref: '#/components/schemas/Evento' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /eventos/{id}/inscripciones:
    post:
      tags: [Inscripciones]
      summary: Inscribirse en un evento (API 5)
      description: |
        Usuario registrado u organizador (no en su propio evento). Máximo 4 lugares por usuario y una inscripción por evento.
        Los cupos se descuentan de forma atómica: `UPDATE ... WHERE disponibles >= cantidad` dentro de una transacción.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/EventoId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InscripcionEntrada' } } }
      responses:
        '201':
          description: Inscripción creada.
          content: { application/json: { schema: { $ref: '#/components/schemas/Inscripcion' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Sin cupos suficientes o ya inscrito.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /inscripciones/{id}:
    get:
      tags: [Inscripciones]
      summary: Consultar una inscripción (API 1)
      description: Solo el dueño de la inscripción, el organizador del evento o un administrador. Cualquier otro recibe 404.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Inscripción.
          content: { application/json: { schema: { $ref: '#/components/schemas/Inscripcion' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
